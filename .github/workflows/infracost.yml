name: Infracost

on:
  pull_request:
    paths:
      - "**/*.tf"
      - ".github/workflows/infracost.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infracost:
    name: Estimar custo da mudança
    runs-on: ubuntu-latest
    env:
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
      TF_PATH: "."   # pasta com os .tf (troque se estiverem em subpasta)

    steps:
      - name: Instalar Infracost CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh
          infracost --version

      - name: Checkout da branch base (antes do PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout da branch do PR
        uses: actions/checkout@v4
        with:
          path: head

      - name: Estimar custo da base
        working-directory: base/${{ env.TF_PATH }}
        run: infracost scan

      - name: Estimar custo do PR
        working-directory: head/${{ env.TF_PATH }}
        run: infracost scan

      - name: Custo por recurso (do mais caro para o mais barato)
        working-directory: head/${{ env.TF_PATH }}
        run: infracost inspect --group-by resource

      - name: Políticas que falharam
        working-directory: head/${{ env.TF_PATH }}
        run: infracost inspect --failing

      - name: Custo agrupado por política
        working-directory: head/${{ env.TF_PATH }}
        run: infracost inspect --group-by policy

      - name: Gerar JSON completo do inspect
        working-directory: head/${{ env.TF_PATH }}
        run: infracost inspect --json > "${{ runner.temp }}/infracost-inspect.json"

      - name: Salvar JSON como artefato
        uses: actions/upload-artifact@v4
        with:
          name: infracost-inspect
          path: ${{ runner.temp }}/infracost-inspect.json
